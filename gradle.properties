# Metaspace grows with the classes on the build's classpath; the ad and
# consent SDKs pushed it past 512 MB and the daemon died mid-build.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Kotlin compiles inside the Gradle daemon rather than in a second JVM, so a
# Codespace holds one large process instead of two.
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
