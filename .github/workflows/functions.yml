# Deploys the Edge Functions whenever they change on main, so what runs on
# Supabase is always what is in the repo. The runtime secrets (Google key,
# package name, RTDN secret) live in Supabase, not here; this job only needs
# the right to deploy.
name: functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno test supabase/functions/_shared/play_test.ts

      - name: Deploy
        run: |
          npx --yes supabase functions deploy play-purchases --project-ref "$SUPABASE_PROJECT_REF"
          # Google calls this one, and Google carries no Supabase JWT; the
          # RTDN secret in the URL is what keeps strangers out.
          npx --yes supabase functions deploy play-rtdn --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
